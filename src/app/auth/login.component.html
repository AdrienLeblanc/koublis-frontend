<div class="d-flex align-items-center h-100">
  <mat-card class="d-flex flex-row align-items-center login-card">
    <img class="w-50" ngSrc="/wine.svg" alt="Logo" width="400" height="400" priority>
    <mat-divider [vertical]="true"/>
    <div class="w-50">
      <span class="mb-4 text-title" translate>APP_NAME</span>
      <form (ngSubmit)="login()" [formGroup]="loginForm" novalidate>
        <div class="text-label error" [hidden]="!error || isLoading" translate>
          Username or password incorrect.
        </div>

        <div class="d-flex flex-column gap-2">
          <mat-form-field [hideRequiredMarker]="true">
            <input type="text" matInput formControlName="username" autocomplete="username" [placeholder]="'Username' | translate" required/>
            @if (loginForm.controls['username'].invalid && loginForm.controls['username'].touched) {
              <mat-error>
                <span translate>Username is required</span>
              </mat-error>
            }
          </mat-form-field>
          <mat-form-field [hideRequiredMarker]="true">
            <input type="password" matInput formControlName="password" autocomplete="current-password"
                   [placeholder]="'Password' | translate" required/>
            @if (loginForm.controls['password'].invalid && loginForm.controls['password'].touched) {
              <mat-error>
                <span translate>Password is required</span>
              </mat-error>
            }
          </mat-form-field>
          <mat-slide-toggle color="primary" formControlName="remember" translate>
            <span class="text-label ml-2" translate>Remember me</span>
          </mat-slide-toggle>

          <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading()">
            @if (isLoading()) {
              <app-loader [message]="'Login' | translate" />
            } @else {
              <span translate>Login</span>
            }
          </button>
        </div>
      </form>
    </div>
  </mat-card>
</div>
