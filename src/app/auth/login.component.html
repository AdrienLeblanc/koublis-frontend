<div class="d-flex flex-column min-h-100vh">
  <div class="d-flex flex-column align-items-center gap-2">
    <h1 class="align-items-center" translate>APP_NAME</h1>
    <div class="d-flex align-items-center gap-2">
      <h4>v{{ version }}</h4>
      <app-language-selector [icon]="true"/>
    </div>
  </div>
  <div class="d-flex align-items-center justify-center flex-grow-1">
    <mat-card class="d-flex">
      <form (ngSubmit)="login()" [formGroup]="loginForm" novalidate>
        <div class="login-error" [hidden]="!error || isLoading" translate>
          Username or password incorrect.
        </div>

        <div class="d-flex flex-column gap-2">
          <mat-form-field [hideRequiredMarker]="true">
            <input type="text" matInput formControlName="username" autocomplete="username"
                   [placeholder]="'Username' | translate" required/>
            @if (loginForm.controls['username'].invalid && loginForm.controls['username'].touched) {
              <mat-error>
                <span translate>Username is required</span>
              </mat-error>
            }
          </mat-form-field>
          <mat-form-field [hideRequiredMarker]="true">
            <input type="password" matInput formControlName="password" autocomplete="current-password"
                   [placeholder]="'Password' | translate" required/>
            @if (loginForm.controls['password'].invalid && loginForm.controls['password'].touched) {
              <mat-error>
                <span translate>Password is required</span>
              </mat-error>
            }
          </mat-form-field>
          <mat-slide-toggle color="primary" formControlName="remember">
            <span translate>Remember me</span>
          </mat-slide-toggle>

          <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading">
            <app-loader [isLoading]="isLoading"></app-loader>
            <span translate>Login</span>
          </button>
        </div>
      </form>
    </mat-card>
  </div>
</div>
